[project]
name = "handedict-freq"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "wordfreq[jieba]>=3.1.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.94",
]

[tool.uv]
package = false

[tool.ruff.lint]
# ruff's default, plus the import and statement rules of its former default, and
# in full the families that suit a small data script
extend-select = [
    "E4", "E7", "E9", "W", # pycodestyle
    "A",    # flake8-builtins
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ERA",  # eradicate (commented-out code)
    "FURB", # refurb
    "I",    # isort
    "N",    # pep8-naming
    "PERF", # perflint
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
]
