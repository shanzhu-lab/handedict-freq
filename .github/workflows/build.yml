name: Build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, after the nightly HanDeDict export: fails early if upstream changes
    # its format or licence, before a consumer updates to it.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --locked ruff format --check
      - run: uv run --locked ruff check
      - run: uv run --locked ty check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Pull latest HanDeDict
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: nix flake update handedict
      - run: nix build
